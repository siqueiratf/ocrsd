{% extends "base.html" %}
{% from "macros.html" import icon %}
{% block title %}Resultados{% endblock %}
{% block scripts %}<script src="/static/results.js?v={{ VERSION }}" defer></script>{% endblock %}
{% block content %}
<section class="results-library">
  <header class="results-head"><h1>Resultados</h1></header>
  <form id="filtros" class="results-filters" role="search" hx-get="/resultados/lista" hx-target="#tabela-jobs" hx-swap="outerHTML" hx-trigger="input delay:300ms, change, submit" hx-sync="this:replace" hx-disinherit="*">
    <label class="search-field">{{ icon('search') }}<input type="search" name="busca" value="{{ search }}" maxlength="120" placeholder="Buscar datasets..." aria-label="Buscar datasets"></label>
    <input type="hidden" name="status" value="{{ status }}"><input type="hidden" name="ordem" value="{{ order }}">
    <input type="hidden" name="modelo" value="{{ document_type }}">
  </form>
  {% include "partials/jobs_table.html" %}
</section>
{% endblock %}
