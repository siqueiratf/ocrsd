{% from "macros.html" import icon %}{% for item in rows %}<div class="result-tree-row {{ 'is-active' if result.selected_document and item.number == result.selected_document.number }}" data-document-label="{{ item.label|lower }}" data-document-row="{{ item.number }}"><a href="/resultados/{{ result.job.id }}?documento={{ item.number }}" hx-get="/resultados/{{ result.job.id }}/documentos/{{ item.number }}" hx-target="#result-workspace" hx-swap="outerHTML" hx-push-url="/resultados/{{ result.job.id }}?documento={{ item.number }}" {% if result.selected_document and item.number == result.selected_document.number %}aria-current="page"{% endif %}>{{ icon('file') }}<span>{{ item.label }}</span></a><details class="menu menu-end"><summary class="icon-btn" aria-label="Ações de {{ item.label }}">{{ icon('more') }}</summary><div class="menu-list">{% if item.json %}<button type="button" hx-get="/resultados/{{ result.job.id }}/documentos/{{ item.number }}/informacoes" hx-target="#modal">Mais informações</button>{% endif %}<a href="/resultados/{{ result.job.id }}/arquivos/{{ item.pdf.id }}" download>Baixar PDF</a>{% if item.json %}<a href="/resultados/{{ result.job.id }}/arquivos/{{ item.json.id }}" download>Baixar JSON</a>{% endif %}</div></details></div>{% endfor %}
