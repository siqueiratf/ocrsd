<div class="result-name-cell" data-result-name-cell data-job-id="{{ job.id }}"><span class="result-status-dot status-dot-{{ job.status }}" data-status-tooltip="{{ STATUS[job.status] }}" role="img" aria-label="Status: {{ STATUS[job.status] }}" tabindex="0"></span><span class="result-name" data-result-name tabindex="0" title="{{ job.name }} · clique duas vezes ou pressione F2 para renomear">{{ job.name }}</span><button type="button" class="icon-btn result-rename-control" data-rename-start aria-label="Renomear {{ job.name }}" title="Renomear">✎</button><form class="result-rename-form" data-rename-form hx-post="/resultados/{{ job.id }}/renomear" hx-target="closest [data-result-name-cell]" hx-swap="outerHTML" hx-sync="this:drop" novalidate hidden><input name="nome" value="{{ job.name }}" maxlength="100" required autocomplete="off" spellcheck="false" aria-label="Novo nome do dataset; Enter salva e Esc cancela"></form></div>
