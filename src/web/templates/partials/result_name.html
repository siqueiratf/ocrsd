{% from "macros.html" import icon %}<div class="result-name-cell" data-result-name-cell data-job-id="{{ job.id }}"><span class="result-status-stack">{% if job.status == 'running' and not job.cancel_requested %}<button type="button" class="result-cancel" hx-post="/resultados/{{ job.id }}/cancelar" hx-target="closest [data-result-name-cell]" hx-swap="outerHTML" hx-confirm="Cancelar a geração de “{{ job.name }}”? Os documentos já prontos ficam disponíveis." hx-disabled-elt="this" aria-label="Cancelar geração de {{ job.name }}" data-tooltip="Cancelar geração">{{ icon('close') }}</button>{% endif %}<span class="result-status-dot status-dot-{{ job.status }}" data-tooltip="{{ 'Cancelamento solicitado' if job.cancel_requested and job.status == 'running' else STATUS[job.status] }}" role="img" aria-label="Status: {{ STATUS[job.status] }}" tabindex="0"></span></span><span class="result-name" data-result-name tabindex="0" title="{{ job.name }} · clique duas vezes ou pressione F2 para renomear">{{ job.name }}</span><button type="button" class="icon-btn result-rename-control" data-rename-start aria-label="Renomear {{ job.name }}" title="Renomear">✎</button><form class="result-rename-form" data-rename-form hx-post="/resultados/{{ job.id }}/renomear" hx-target="closest [data-result-name-cell]" hx-swap="outerHTML" hx-sync="this:drop" novalidate hidden><input name="nome" value="{{ job.name }}" maxlength="100" required autocomplete="off" spellcheck="false" aria-label="Novo nome do dataset; Enter salva e Esc cancela"></form></div>
