{% from "macros.html" import dialog_head, icon %}
<div class="dialog-panel">{{ dialog_head('Baixar dataset') }}<form action="/resultados/{{ result.job.id }}/exportar/arquivo" method="get" class="dialog-body form-stack" data-export-form><label class="field">Nome do arquivo <span class="optional">opcional</span><input name="nome" maxlength="100" placeholder="{{ result.job.options.document_type if result.job.options else 'dataset-sintetico' }}"></label><label class="check"><input type="checkbox" name="pdfs" value="true" checked> PDFs</label><label class="check"><input type="checkbox" name="jsons" value="true" checked> JSONs de referência</label><p class="hint">Com ambos os formatos, o ZIP também inclui o manifesto do dataset.</p><footer class="dialog-foot"><button class="btn" type="button" data-fechar>Cancelar</button><button class="btn btn-primary" type="submit">{{ icon('download') }}Baixar ZIP</button></footer></form></div>
