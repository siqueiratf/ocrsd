[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrsd"
version = "1.0.0"
description = "Template-based document detection, redaction and OCR tools"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy<3",
    "scipy",
    "opencv-python-headless",
    "PyMuPDF",
    "easyocr",
    "reportlab",
    "Pillow",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3", "jinja2>=3.1,<4", "python-multipart>=0.0.20,<1"]
test = ["httpx2>=2,<3", "jsonschema>=4.23,<5"]
benchmark = ["transformers==4.44.2", "sentencepiece", "pytesseract"]
paddle = ["paddlepaddle==3.2.0", "paddleocr>=3,<4"]
handwriting = ["tensorflow-cpu>=2.20,<2.21"]

[project.scripts]
ocrsd = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.web", "src.semantic", "src.mapping_assist"]

[tool.setuptools.package-data]
"src.web" = ["templates/*.html", "templates/partials/*.html", "static/*"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
