limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=clients:10m;
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}
server {
    listen 6000;
    server_name _;
    set_real_ip_from 172.30.86.1;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    server_tokens off;
    client_max_body_size 18m;
    client_body_timeout 10s;
    send_timeout 30s;
    limit_conn clients 20;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    error_page 429 = @rate_limit;
    error_page 413 = @body_limit;
    location @rate_limit {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limit","message":"Limite de requisições atingido"}}';
    }
    location @body_limit {
        default_type application/json;
        return 413 '{"error":{"code":"too_large","message":"Corpo da requisição excede o limite"}}';
    }
    location = /api/docs {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com" always;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
