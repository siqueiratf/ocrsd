name: ocrsd

# The institutional edge terminates HTTPS and forwards to this host on port 6000.
# Host networking lets the API and worker use the existing loopback-only Ollama.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: [uvicorn, src.web.api:create_app, --factory, --host, 127.0.0.1, --port, "8000", --proxy-headers, --forwarded-allow-ips, 127.0.0.1]
    network_mode: host
    env_file: .env.production
    environment:
      OCRSD_STORAGE: /data
      OCRSD_STANDARD_EDITS: "false"
    volumes:
      - jobs:/data
      - ../assets/handwriting:/app/assets/handwriting:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: [python, -m, src.web.worker]
    network_mode: host
    env_file: .env.production
    environment:
      OCRSD_STORAGE: /data
      OCRSD_STANDARD_EDITS: "false"
    volumes:
      - jobs:/data
      - ../assets/handwriting:/app/assets/handwriting:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 5g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 16m
    healthcheck:
      test: [CMD, python, -m, src.web.worker, --health]
      interval: 15s
      timeout: 5s
      retries: 3
  web:
    build:
      context: ..
      dockerfile: deploy/nginx.Dockerfile
    network_mode: host
    volumes:
      - ./nginx.ssh2.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:6000/api/v1/health]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  jobs:
    name: ocrsd_jobs
