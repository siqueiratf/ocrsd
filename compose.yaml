services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: deploy/.env
    environment:
      OCRSD_STORAGE: /data
    volumes:
      - jobs:/data
      - ${OCRSD_HANDWRITING_ASSETS:-./assets/handwriting}:/app/assets/handwriting:ro
    networks:
      private:
        ipv4_address: 172.30.85.3
    expose:
      - "8000"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: [python, -m, src.web.worker]
    networks:
      private:
        ipv4_address: 172.30.85.4
    env_file: deploy/.env
    environment:
      OCRSD_STORAGE: /data
    volumes:
      - jobs:/data
      - ${OCRSD_HANDWRITING_ASSETS:-./assets/handwriting}:/app/assets/handwriting:ro
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 5g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 16m
    healthcheck:
      test: [CMD, python, -m, src.web.worker, --health]
      interval: 15s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    networks:
      private:
        ipv4_address: 172.30.85.2
      edge:
        ipv4_address: 172.30.86.2
    ports:
      - "${OCRSD_BIND_ADDRESS:-127.0.0.1}:${OCRSD_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  jobs:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.86.0/24
  private:
    internal: true
    ipam:
      config:
        - subnet: 172.30.85.0/24
